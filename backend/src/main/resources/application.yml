server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: studentseva-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres.gesveqbuqntwaipljhxo}
    password: ${DB_PASSWORD:StudentSeva@2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Exclude only mail for now until we configure Gmail SMTP credentials in Day 4
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# ── StudentSeva custom application config ──────────────────────────────────────
app:
  # Frontend URL — used by CORS to allow only our React app to call the API
  # In dev: http://localhost:5173 (Vite default port)
  # In prod (Render + Vercel): set FRONTEND_URL env var in Render dashboard
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # JWT Configuration (Day 3 - Phase 2: used by JwtService)
  jwt:
    # Secret key for signing tokens — MUST be set via JWT_SECRET env var in production
    secret: ${JWT_SECRET:super_secret_jwt_key_studentseva_2026_for_signing_http_only_cookie_tokens}
    # Token validity: 604800000 ms = 7 days (safe for OTP-based passwordless auth)
    expiration-ms: 604800000
    # Name of the httpOnly cookie that stores the JWT
    cookie-name: nearbuzz_token

  # OTP Configuration (Day 4: used by AuthService)
  otp:
    expiration-minutes: 5
    max-per-10-minutes: 5

  # Cookie Security (false in dev localhost HTTP, true in prod HTTPS)
  cookie:
    secure: ${COOKIE_SECURE:false}

  # Cloudflare R2 Object Storage (falls back to ./uploads when blank in local dev)
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:nearbuzz-media}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-url: ${R2_PUBLIC_URL:}

  # Google Gemini AI Natural-Language Search (falls back to rule-based parser if blank)
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}

  # Transactional Email via Brevo HTTPS API (works on Render free tier)
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:NearBuzz}
