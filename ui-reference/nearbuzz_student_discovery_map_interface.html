<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NearBuzz — Student Discovery &amp; Map Interface</title>
  <style>
    /* =========================================================================
       DESIGN TOKENS & BASE RESET (INDIGO & BLUE STUDENT THEME)
       ========================================================================= */
    :root {
      --indigo: #4f46e5;
      --indigo-dark: #4338ca;
      --indigo-soft: #eef2ff;
      --indigo-border: #c7d2fe;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --emerald-border: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 20px 44px rgba(15, 23, 42, 0.18);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 76px;
    }

    @media (min-width: 768px) {
      body {
        padding-bottom: 0;
      }
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
    }

    @media (min-width: 640px) {
      .container {
        padding: 0 24px;
      }
    }

    /* =========================================================================
       STICKY TOP NAVBAR
       ========================================================================= */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 66px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--indigo), var(--blue));
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
      flex-shrink: 0;
    }

    .brand-text-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .campus-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--indigo);
      background: var(--indigo-soft);
      border: 1px solid var(--indigo-border);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .nav-tabs {
      display: none;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 14px;
    }

    @media (min-width: 768px) {
      .nav-tabs {
        display: flex;
      }
    }

    .nav-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.16s ease;
    }

    .nav-tab:hover {
      color: var(--indigo);
      background: rgba(255, 255, 255, 0.65);
    }

    .nav-tab.active {
      background: #fff;
      color: var(--indigo);
      box-shadow: var(--shadow-xs);
    }

    .nav-badge {
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-badge.unread {
      background: #ef4444;
      color: #fff;
    }

    .nav-badge.saved {
      background: var(--indigo-soft);
      color: var(--indigo);
    }

    .student-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      background: var(--indigo-soft);
      color: var(--indigo-dark);
      border: 1px solid var(--indigo-border);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================================================================
       MOBILE BOTTOM NAVIGATION BAR
       ========================================================================= */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
    }

    @media (min-width: 768px) {
      .mobile-nav {
        display: none;
      }
    }

    .mobile-nav-btn {
      border: none;
      background: transparent;
      color: var(--text-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      position: relative;
    }

    .mobile-nav-btn.active {
      color: var(--indigo);
      background: var(--indigo-soft);
    }

    .mobile-nav-badge {
      position: absolute;
      top: 3px;
      right: calc(50% - 22px);
      font-size: 10px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       HERO NATURAL-LANGUAGE SEARCH BANNER
       ========================================================================= */
    .hero-wrap {
      padding-top: 20px;
    }

    .hero {
      background: linear-gradient(135deg, #4f46e5 0%, #3b5bdb 50%, #2563eb 100%);
      color: #fff;
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.22);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero {
        padding: 36px 36px 30px;
      }
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.14) 0%, transparent 70%);
      top: -90px;
      right: -70px;
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.025em;
      max-width: 720px;
    }

    @media (min-width: 768px) {
      .hero h1 {
        font-size: 32px;
      }
    }

    .hero-sub {
      margin: 8px 0 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      max-width: 650px;
    }

    @media (min-width: 768px) {
      .hero-sub {
        font-size: 15px;
      }
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 14px;
      padding: 6px;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      max-width: 780px;
    }

    .search-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      min-height: 40px;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-clear-btn {
      border: none;
      background: #f1f5f9;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-submit-btn {
      border: none;
      background: var(--indigo);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 10px;
      transition: background 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-submit-btn:hover {
      background: var(--indigo-dark);
    }

    .quick-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .quick-tags-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .quick-tag {
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      transition: all 0.15s ease;
    }

    .quick-tag:hover {
      background: rgba(255, 255, 255, 0.26);
      transform: translateY(-1px);
    }

    .location-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
    }

    .gps-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .gps-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .hero-select {
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(15, 23, 42, 0.22);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 11px;
      outline: none;
      cursor: pointer;
    }

    .hero-select option {
      color: var(--text);
      background: #fff;
    }

    /* =========================================================================
       CATEGORY PILLS & TOOLBAR
       ========================================================================= */
    .category-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 18px 0 6px;
      scrollbar-width: none;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      padding: 9px 15px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-xs);
    }

    .cat-pill:hover {
      border-color: var(--indigo-border);
      color: var(--indigo);
    }

    .cat-pill.active {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 18px;
    }

    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .results-count {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      margin-right: 4px;
    }

    .filter-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--indigo-soft);
      border-color: var(--indigo);
      color: var(--indigo);
    }

    .sort-select {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      outline: none;
      cursor: pointer;
    }

    .view-toggle {
      display: inline-flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 12px;
    }

    .view-toggle-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .view-toggle-btn.active {
      background: #fff;
      color: var(--indigo);
      box-shadow: var(--shadow-xs);
    }

    /* =========================================================================
       SHOP CARDS GRID
       ========================================================================= */
    .shops-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding-bottom: 40px;
    }

    @media (min-width: 640px) {
      .shops-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .shops-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .shop-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .shop-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--indigo-border);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--indigo);
      background: var(--indigo-soft);
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dist-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
    }

    .save-icon-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-subtle);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .save-icon-btn:hover {
      border-color: var(--indigo);
      color: var(--indigo);
    }

    .save-icon-btn.saved {
      background: var(--indigo-soft);
      border-color: var(--indigo);
      color: var(--indigo);
    }

    .shop-title-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 2px;
    }

    .shop-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
    }

    .verified-icon {
      color: var(--blue);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 10px;
      width: fit-content;
    }

    .status-pill.green {
      background: var(--emerald-soft);
      color: #047857;
      border: 1px solid var(--emerald-border);
    }

    .status-pill.amber {
      background: var(--amber-soft);
      color: #b45309;
      border: 1px solid var(--amber-border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: 8px;
    }

    .card-footer {
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price-block {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-subtle);
    }

    .price-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .btn-primary {
      border: none;
      background: var(--indigo);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 11px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--indigo-dark);
    }

    .btn-secondary {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      padding: 9px 13px;
      border-radius: 11px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      border-color: var(--indigo-border);
      color: var(--indigo);
      background: var(--indigo-soft);
    }

    .compare-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
    }

    .compare-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-subtle);
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .compare-check.checked {
      background: var(--indigo-soft);
      border-color: var(--indigo);
      color: var(--indigo);
    }

    .compare-check input {
      accent-color: var(--indigo);
      margin: 0;
      cursor: pointer;
    }

    /* =========================================================================
       INTERACTIVE CAMPUS MAP VIEW
       ========================================================================= */
    .map-shell {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 40px;
    }

    .map-header {
      padding: 12px 16px;
      background: var(--indigo-soft);
      border-bottom: 1px solid var(--indigo-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--indigo-dark);
    }

    .map-canvas {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: #eef4ff;
      background-image:
        linear-gradient(to right, rgba(79, 70, 229, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(79, 70, 229, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .map-canvas {
        height: 540px;
      }
    }

    .map-landmark {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .map-landmark-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      border: 2px solid #fff;
    }

    .map-landmark-label {
      margin-top: 3px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
    }

    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);

    /* =========================================================================

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getShopById(id) {
      return SHOPS.find((s) => s.id === id);
    }

    function showToast(message, variant = 'default') {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = `toast ${variant}`;
      const icon = variant === 'success' ? '✓' : variant === 'indigo' ? '💬' : 'ℹ️';
      el.innerHTML = `<span>${icon}</span><span>${escapeHtml(message)}</span>`;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3000);
    }

    /* =========================================================================
       5. SMART NATURAL-LANGUAGE SEARCH & FILTERING ENGINE
       ========================================================================= */
    function getFilteredShops() {
      const rawQ = state.searchQuery.trim().toLowerCase();

      // Parse optional price ceiling like "under 9000" or "below 1000"
      let maxPrice = null;
      const priceMatch = rawQ.match(/(?:under|below|less than|<=?)\s*₹?\s*(\d+)/i);
      if (priceMatch) {
        maxPrice = parseInt(priceMatch[1], 10);
      }

      // Clean meaningful keywords
      const stopWords = new Set(['under', 'below', 'less', 'than', 'nearby', 'near', 'me', 'in', 'for', 'a', 'the', 'and', 'with']);
      const tokens = rawQ
        .replace(/₹?\d+/g, '')
        .split(/[\s,/-]+/)
        .map((t) => t.trim())
        .filter((t) => t.length >= 2 && !stopWords.has(t));

      let list = SHOPS.filter((shop) => {
        if (shop.distanceMeters > state.maxDistance) return false;
        if (state.selectedCategory !== 'All' && shop.category !== state.selectedCategory) return false;
        if (state.onlyOpenNow && !shop.openNow) return false;
        if (state.onlyAvailableToday && !shop.availableToday) return false;

        if (maxPrice !== null && shop.startingPrice > maxPrice) {
          return false;
        }

        if (tokens.length > 0) {
          const haystack = [
            shop.name,
            shop.category,
            shop.liveStatus,
            shop.address,
            ...shop.tags,
            JSON.stringify(shop.details)
          ].join(' ').toLowerCase();

          // Map synonyms so natural queries feel smart
          const synonymMap = {
            room: ['hostel', 'pg', 'room', 'bed'],
            rooms: ['hostel', 'pg', 'room', 'bed'],
            tiffin: ['tiffin', 'mess', 'thali', 'meal'],
            veg: ['veg', 'pure veg'],
            xerox: ['xerox', 'print', 'photocopy'],
            wait: ['waiting', 'fast'],
            no: ['no waiting'],
            water: ['water', '20l', 'can'],
            second: ['second-hand', 'second hand'],
            hand: ['second-hand', 'second hand']
          };

          const allMatch = tokens.every((tok) => {
            if (haystack.includes(tok)) return true;
            if (synonymMap[tok]) {
              return synonymMap[tok].some((alt) => haystack.includes(alt));
            }
            return false;
          });

          if (!allMatch) return false;
        }

        return true;
      });

      if (state.sortBy === 'price') {
        list.sort((a, b) => a.startingPrice - b.startingPrice);
      } else {
        list.sort((a, b) => a.distanceMeters - b.distanceMeters);
      }

      return list;
    }

    /* =========================================================================

       ========================================================================= */
    function switchTab(tab) {
      state.activeTab = tab;
      if (tab === 'updates' && state.unreadUpdates > 0) {
        state.unreadUpdates = 0;
      }
      syncNavUI();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function syncNavUI() {
      ['discover', 'updates', 'saved'].forEach((t) => {
        const cap = t.charAt(0).toUpperCase() + t.slice(1);
        document.getElementById('nav' + cap)?.classList.toggle('active', state.activeTab === t);
        document.getElementById('mob' + cap)?.classList.toggle('active', state.activeTab === t);
      });

      const unreadEls = [document.getElementById('navUnreadBadge'), document.getElementById('mobUnreadBadge')];
      unreadEls.forEach((el) => {
        if (!el) return;
        if (state.unreadUpdates > 0) {
          el.style.display = 'inline-flex';
          el.textContent = state.unreadUpdates;
        } else {
          el.style.display = 'none';
        }
      });

      const savedCount = state.savedIds.size;
      [document.getElementById('navSavedBadge'), document.getElementById('mobSavedBadge')].forEach((el) => {
        if (el) el.textContent = savedCount;
      });
    }

      const root = document.getElementById('appRoot');
      if (state.activeTab === 'discover') {

      } else if (state.activeTab === 'updates') {
        root.innerHTML = renderUpdatesTab();
      } else {
        root.innerHTML = renderSavedTab();
      }
      syncCompareBar();
    }

                  <span>${state.gpsLocating ? '⏳' : '📍'}</span>
                  <span>${state.gpsLocating ? 'Locating...' : state.gpsLocked ? 'Near: Bholaram Ustad Marg, Indore' : 'Use My GPS'}</span>
                </button>

                <select class="hero-select" aria-label="Select campus area" onchange="state.campus = this.value; showToast('Switched campus to ' + this.value);">
                  ${['Bholaram Ustad Marg, Indore', 'Bhawarkua Square, Indore', 'Vijay Nagar Campus, Indore']
                    .map((c) => `<option value="${c}" ${state.campus === c ? 'selected' : ''}>🎓 ${c}</option>`)
                    .join('')}
                </select>

                <select class="hero-select" aria-label="Select max distance" onchange="state.maxDistance = Number(this.value); renderApp();">
                  <option value="500" ${state.maxDistance === 500 ? 'selected' : ''}>Within 500 m</option>
                  <option value="1000" ${state.maxDistance === 1000 ? 'selected' : ''}>Within 1 km</option>
                  <option value="2000" ${state.maxDistance === 2000 ? 'selected' : ''}>Within 2 km</option>
                  <option value="5000" ${state.maxDistance === 5000 ? 'selected' : ''}>Within 5 km</option>
                </select>
              </div>
            </div>
          </section>

          <!-- CATEGORY FILTER PILLS -->
          <div class="category-bar" role="tablist" aria-label="Service categories">
            ${CATEGORIES.map(
              (c) => `
                <button
                  type="button"
                  class="cat-pill ${state.selectedCategory === c.key ? 'active' : ''}"
                  onclick="state.selectedCategory = '${c.key}'; renderApp();"
                >
                  <span>${c.icon}</span>
                  <span>${c.label}</span>
                </button>
              `
            ).join('')}
          </div>

          <!-- DYNAMIC RESULTS CONTAINER -->
          <div id="discoverResultsMount">
            ${renderDiscoverResultsInner(shops)}
          </div>
        </div>
      `;
    }

    function renderDiscoverResultsOnly() {
      const mount = document.getElementById('discoverResultsMount');
      if (mount) {
        mount.innerHTML = renderDiscoverResultsInner(getFilteredShops());
      }
    }

    function renderDiscoverResultsInner(shops) {
      return `
        <!-- TOOLBAR -->
        <div class="toolbar">
          <div class="toolbar-left">
            <span class="results-count">${shops.length} ${shops.length === 1 ? 'place' : 'places'} found nearby</span>
            <button
              type="button"
              class="filter-chip ${state.onlyOpenNow ? 'active' : ''}"
              onclick="state.onlyOpenNow = !state.onlyOpenNow; renderApp();"
            >
              ${state.onlyOpenNow ? '✓ ' : ''}Open Now
            </button>
            <button
              type="button"
              class="filter-chip ${state.onlyAvailableToday ? 'active' : ''}"
              onclick="state.onlyAvailableToday = !state.onlyAvailableToday; renderApp();"
            >
              ${state.onlyAvailableToday ? '✓ ' : ''}Available Today
            </button>
            <select class="sort-select" aria-label="Sort results" onchange="state.sortBy = this.value; renderApp();">
              <option value="nearest" ${state.sortBy === 'nearest' ? 'selected' : ''}>Sort: Nearest First</option>
              <option value="price" ${state.sortBy === 'price' ? 'selected' : ''}>Sort: Lowest Price</option>
            </select>
          </div>

          <div class="view-toggle" role="group" aria-label="Toggle Grid or Map View">
            <button
              type="button"
              class="view-toggle-btn ${state.viewMode === 'grid' ? 'active' : ''}"
              onclick="state.viewMode = 'grid'; renderApp();"
            >
              <span>▦</span><span>Grid View</span>
            </button>
            <button
              type="button"
              class="view-toggle-btn ${state.viewMode === 'map' ? 'active' : ''}"
              onclick="state.viewMode = 'map'; renderApp();"
            >
              <span>🗺️</span><span>Map View</span>
            </button>
          </div>
        </div>

        <!-- RESULTS: GRID OR MAP -->
        ${state.viewMode === 'grid' ? renderShopsGrid(shops) : renderCampusMap(shops)}
      `;
    }

    function renderShopsGrid(shops) {
      if (shops.length === 0) {
        return `
          <div class="empty-state" style="margin-bottom:40px;">
            <div style="font-size:36px; margin-bottom:8px;">🔍</div>
            <h3 style="margin:0; font-size:18px; font-weight:800;">No campus services match your filter</h3>
            <p style="margin:6px 0 16px; font-size:14px; color:var(--text-muted);">Try increasing your distance radius or clearing your search query.</p>
            <button class="btn-primary" onclick="resetAllFilters()">Reset Filters</button>
          </div>
        `;
      }

      return `
        <div class="shops-grid">
          ${shops.map((shop) => {
            const isSaved = state.savedIds.has(shop.id);
            const canCompare = shop.category === 'Hostels & PGs' || shop.category === 'Study Libraries';
            const isCompared = state.compareIds.includes(shop.id);

            return `
              <article class="shop-card">
                <div style="display:flex; flex-direction:column; gap:10px;">
                  <div class="card-top-row">
                    <div class="card-meta-left">
                      <span class="cat-badge"><span>${shop.emoji}</span><span>${escapeHtml(shop.category)}</span></span>
                      <span class="dist-badge">${shop.distanceMeters} m away</span>
                    </div>
                    <button
                      type="button"
                      class="save-icon-btn ${isSaved ? 'saved' : ''}"
                      onclick="toggleSave('${shop.id}')"
                      aria-label="${isSaved ? 'Remove from saved' : 'Save shop'}"
                      title="${isSaved ? 'Saved' : 'Save shop'}"
                    >
                      ${BOOKMARK_SVG(isSaved)}
                    </button>
                  </div>

                  <div class="shop-title-row">
                    <h3 class="shop-title">${escapeHtml(shop.name)}</h3>
                    ${shop.verified ? VERIFIED_SVG : ''}
                  </div>

                  <div class="status-pill ${shop.liveTone}">
                    <span class="status-dot"></span>
                    <span>${escapeHtml(shop.liveStatus)}</span>
                  </div>

                  <div class="card-tags">
                    ${shop.tags.slice(0, 3).map((t) => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}
                  </div>
                </div>

                <div>
                  <div class="card-footer">
                    <div class="price-block">
                      <span class="price-label">Starts at</span>
                      <span class="price-value">${escapeHtml(shop.priceText)}</span>
                    </div>
                    <button type="button" class="btn-primary" onclick="openDetailModal('${shop.id}')">
                      See Prices &amp; Hours
                    </button>
                  </div>

                  ${
                    canCompare
                      ? `
                        <div class="compare-row">
                          <label class="compare-check ${isCompared ? 'checked' : ''}">
                            <input
                              type="checkbox"
                              ${isCompared ? 'checked' : ''}
                              onchange="toggleCompare('${shop.id}')"
                            />
                            <span>${isCompared ? 'Added to Compare' : 'Compare'}</span>
                          </label>
                          <span style="font-size:11px; color:var(--text-subtle); font-weight:600;">
                            ${state.followedIds.has(shop.id) ? '🔔 Following' : ''}
                          </span>
                        </div>
                      `
                      : state.followedIds.has(shop.id)
                      ? `<div class="compare-row"><span style="font-size:11px; color:var(--emerald); font-weight:700;">🔔 Following updates</span></div>`
                      : ''
                  }
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCampusMap(shops) {
      const selectedShop = shops.find((s) => s.id === state.selectedMapShopId) || shops[0] || null;
      const landmarks = [
        { name: 'Campus Gate 1', x: 24, y: 38 },
        { name: 'Campus Gate 2', x: 66, y: 24 },
        { name: 'Bholaram Ustad Marg', x: 48, y: 56 },
        { name: 'Hostel Lane', x: 74, y: 74 }
      ];

      return `
        <div class="map-shell">
          <div class="map-header">
            <span>🗺️ Interactive Campus Map — ${escapeHtml(state.campus)}</span>
            <span>Tap any emoji pin to preview prices &amp; availability</span>
          </div>

          <div class="map-canvas">
            <!-- Stylized Campus Roads SVG -->
            <svg style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;" viewBox="0 0 900 500" preserveAspectRatio="none">
              <path d="M 0 250 Q 260 220 500 245 T 900 195" stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round"/>
              <path d="M 0 250 Q 260 220 500 245 T 900 195" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 10" fill="none"/>
              <path d="M 215 0 L 250 500" stroke="#ffffff" stroke-width="24" fill="none"/>
              <path d="M 590 0 L 570 242" stroke="#ffffff" stroke-width="22" fill="none"/>
              <path d="M 580 245 L 650 500" stroke="#ffffff" stroke-width="20" fill="none"/>
              <rect x="650" y="30" width="190" height="105" rx="22" fill="#dbeafe" opacity="0.65"/>
              <rect x="30" y="320" width="150" height="120" rx="22" fill="#e0e7ff" opacity="0.65"/>
            </svg>

            <!-- Campus Landmarks -->
            ${landmarks.map((lm) => `
              <div class="map-landmark" style="left:${lm.x}%; top:${lm.y}%;">
                <span class="map-landmark-dot"></span>
                <span class="map-landmark-label">${lm.name}</span>
              </div>
            `).join('')}

            <!-- Shop Emoji Pins -->
            ${shops.map((shop) => {
              const active = selectedShop && selectedShop.id === shop.id;
              return `
                <button
                  type="button"
                  class="map-pin ${active ? 'selected' : ''}"
                  style="left:${shop.mapPos.x}%; top:${shop.mapPos.y}%;"
                  onclick="state.selectedMapShopId='${shop.id}'; renderApp();"
                  aria-label="${escapeHtml(shop.name)}"
                >
                  <span style="font-size:17px;">${shop.emoji}</span>
                  <span class="map-pin-price">${escapeHtml(shop.priceText)}</span>
                </button>
              `;
            }).join('')}

            <!-- Floating Selected Pin Preview Card -->
            ${
              selectedShop
                ? `
                  <div class="map-preview-card">
                    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
                      <div>
                        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                          <span class="cat-badge">${selectedShop.emoji} ${escapeHtml(selectedShop.category)}</span>
                          <span class="dist-badge">${selectedShop.distanceMeters} m away</span>
                        </div>
                        <div class="shop-title-row">
                          <h3 style="margin:0; font-size:16px; font-weight:800;">${escapeHtml(selectedShop.name)}</h3>
                          ${VERIFIED_SVG}
                        </div>
                        <div style="margin-top:6px;" class="status-pill ${selectedShop.liveTone}">
                          <span class="status-dot"></span>
                          <span>${escapeHtml(selectedShop.liveStatus)}</span>
                        </div>
                      </div>
                      <button
                        type="button"
                        class="save-icon-btn ${state.savedIds.has(selectedShop.id) ? 'saved' : ''}"
                        onclick="toggleSave('${selectedShop.id}')"
                        aria-label="Save shop"
                      >
                        ${BOOKMARK_SVG(state.savedIds.has(selectedShop.id))}
                      </button>
                    </div>

                    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid #f1f5f9;">
                      <div>
                        <span class="price-label">Starts at</span>
                        <div class="price-value">${escapeHtml(selectedShop.priceText)}</div>
                      </div>
                      <button type="button" class="btn-primary" onclick="openDetailModal('${selectedShop.id}')">
                        See Prices &amp; Hours →
                      </button>
                    </div>
                  </div>
                `
                : `<div class="map-preview-card" style="text-align:center; font-weight:700; color:var(--text-muted);">No shops match the current filters on map.</div>`
            }
          </div>
        </div>
      `;
    }

    /* =========================================================================
       9. TAB 2 — UPDATES (LIVE FEED FROM VENDORS)
       ========================================================================= */
    function renderUpdatesTab() {
      const filteredUpdates =
        state.updatesFilter === 'following'
          ? UPDATES_FEED.filter((u) => state.followedIds.has(u.shopId))
          : UPDATES_FEED;

      return `
        <div class="container">
          <div class="feed-container">
            <div class="section-header-row">
              <div>
                <h1 class="section-title">Live Campus Updates</h1>
                <p class="section-subtitle">Daily mess menus, seat openings, and print offers directly from owners</p>
              </div>
              <div class="view-toggle">
                <button
                  type="button"
                  class="view-toggle-btn ${state.updatesFilter === 'following' ? 'active' : ''}"
                  onclick="state.updatesFilter='following'; renderApp();"
                >
                  Following Only (${UPDATES_FEED.filter((u) => state.followedIds.has(u.shopId)).length})
                </button>
                <button
                  type="button"
                  class="view-toggle-btn ${state.updatesFilter === 'all' ? 'active' : ''}"
                  onclick="state.updatesFilter='all'; renderApp();"
                >
                  All Nearby (${UPDATES_FEED.length})
                </button>
              </div>
            </div>

            ${
              filteredUpdates.length === 0
                ? `
                  <div class="empty-state">
                    <div style="font-size:36px; margin-bottom:8px;">🔔</div>
                    <h3 style="margin:0; font-size:17px; font-weight:800;">You're not following any shops yet</h3>
                    <p style="margin:6px 0 16px; font-size:14px; color:var(--text-muted);">Follow your regular mess, library, or print shop to get daily updates here.</p>
                    <button class="btn-primary" onclick="state.updatesFilter='all'; renderApp();">Show All Nearby Updates</button>
                  </div>
                `
                : filteredUpdates.map((upd) => {
                    const shop = getShopById(upd.shopId);
                    if (!shop) return '';
                    const isFollowing = state.followedIds.has(shop.id);
                    return `
                      <article class="update-card">
                        <div class="update-head">
                          <div style="display:flex; align-items:flex-start; gap:12px;">
                            <div class="update-avatar">${shop.emoji}</div>
                            <div>
                              <div class="shop-title-row">
                                <strong style="font-size:15px; font-weight:800;">${escapeHtml(shop.name)}</strong>
                                ${VERIFIED_SVG}
                              </div>
                              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:3px;">
                                <span class="cat-badge">${escapeHtml(shop.category)}</span>
                                <span style="font-size:12px; color:var(--text-subtle); font-weight:600;">• ${escapeHtml(upd.time)}</span>
                              </div>
                            </div>
                          </div>

                          <button
                            type="button"
                            class="filter-chip ${isFollowing ? 'active' : ''}"
                            onclick="toggleFollow('${shop.id}')"
                          >
                            ${isFollowing ? '✓ Following' : '+ Follow'}
                          </button>
                        </div>

                        <p class="update-body">${escapeHtml(upd.body)}</p>

                        ${
                          upd.hasThaliPhoto
                            ? `
                              <div class="illustrated-card" style="margin-bottom:14px;">
                                ${makeThaliSvg(upd.photoLabel, upd.photoDish)}
                              </div>
                            `
                            : ''
                        }

                        <div class="update-actions">
                          <button type="button" class="btn-primary" onclick="openDetailModal('${shop.id}')">View Shop</button>
                          <button type="button" class="btn-whatsapp" onclick="triggerWhatsApp('${shop.id}')">💬 WhatsApp</button>
                        </div>
                      </article>
                    `;
                  }).join('')
            }
          </div>
        </div>
      `;
    }

    /* =========================================================================
       10. TAB 3 — SAVED & FOLLOWING HUB
       ========================================================================= */
    function renderSavedTab() {
      const savedShops = SHOPS.filter((s) => state.savedIds.has(s.id));
      const filterPills = ['All Saved', 'Following (Updates On)', ...CATEGORIES.slice(1).map((c) => c.key)];

      const visibleShops = savedShops.filter((s) => {
        if (state.savedFilter === 'All Saved') return true;
        if (state.savedFilter === 'Following (Updates On)') return state.followedIds.has(s.id);
        return s.category === state.savedFilter;
      });

      return `
        <div class="container">
          <div class="saved-container">
            <div class="section-header-row">
              <div>
                <h1 class="section-title">Saved &amp; Following</h1>
                <p class="section-subtitle">Your daily campus speed-dial for regular tiffin, hostels, libraries &amp; shops</p>
              </div>
              <button class="btn-secondary" onclick="switchTab('discover')">+ Find More Shops</button>
            </div>

            <div class="category-bar" style="padding-top:0;">
              ${filterPills.map((fp) => `
                <button
                  type="button"
                  class="cat-pill ${state.savedFilter === fp ? 'active' : ''}"
                  onclick="state.savedFilter='${fp}'; renderApp();"
                >
                  ${escapeHtml(fp)}
                </button>
              `).join('')}
            </div>

            ${
              visibleShops.length === 0
                ? `
                  <div class="empty-state" style="margin-top:16px;">
                    <div style="font-size:38px; margin-bottom:8px;">🔖</div>
                    <h3 style="margin:0; font-size:18px; font-weight:800;">No saved shops here yet</h3>
                    <p style="margin:6px 0 18px; font-size:14px; color:var(--text-muted);">Tap the bookmark icon on any shop card to keep it handy for 1-tap calls and WhatsApp.</p>
                    <button class="btn-primary" onclick="switchTab('discover')">Explore Nearby Services</button>
                  </div>
                `
                : `
                  <div class="saved-grid">
                    ${visibleShops.map((shop) => {
                      const isFollowing = state.followedIds.has(shop.id);
                      return `
                        <article class="saved-card">
                          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
                            <div>
                              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px;">
                                <span class="cat-badge">${shop.emoji} ${escapeHtml(shop.category)}</span>
                                <span class="dist-badge">${shop.distanceMeters} m away</span>
                              </div>
                              <div class="shop-title-row">
                                <h3 class="shop-title">${escapeHtml(shop.name)}</h3>
                                ${VERIFIED_SVG}
                              </div>
                              <div style="margin-top:8px;" class="status-pill ${shop.liveTone}">
                                <span class="status-dot"></span>
                                <span>${escapeHtml(shop.liveStatus)}</span>
                              </div>
                            </div>
                            <span style="font-size:15px; font-weight:800; color:var(--indigo); white-space:nowrap;">${escapeHtml(shop.priceText)}</span>
                          </div>

                          <div class="speed-dial-row">
                            <button type="button" class="btn-secondary" onclick="triggerCall('${shop.id}')">📞 Call</button>
                            <button type="button" class="btn-whatsapp" onclick="triggerWhatsApp('${shop.id}')">💬 WhatsApp</button>
                            <button type="button" class="btn-primary" onclick="openDetailModal('${shop.id}')">See Prices</button>
                            <button
                              type="button"
                              class="filter-chip ${isFollowing ? 'active' : ''}"
                              onclick="toggleFollow('${shop.id}')"
                            >
                              ${isFollowing ? '🔔 Updates On' : '🔕 Updates Off'}
                            </button>
                            <button
                              type="button"
                              class="filter-chip"
                              style="color:var(--red); border-color:#fecaca;"
                              onclick="toggleSave('${shop.id}')"
                            >
                              Remove
                            </button>
                          </div>
                        </article>
                      `;
                    }).join('')}
                  </div>
                `
            }
          </div>
        </div>
      `;
    }

    /* =========================================================================
       11. BUSINESS-SPECIFIC SHOP DETAIL MODAL
       ========================================================================= */
    function openDetailModal(shopId) {
      state.activeDetailShopId = shopId;
      state.detailInStoreSearch = '';
      state.detailKiranaShelf = 'All';
      renderDetailModal();
      document.getElementById('detailModal').classList.add('open');
    }

    function closeDetailModal() {
      state.activeDetailShopId = null;
      document.getElementById('detailModal').classList.remove('open');
    }

    function renderDetailModal() {
      const shop = getShopById(state.activeDetailShopId);
      if (!shop) return;

      const isSaved = state.savedIds.has(shop.id);
      const isFollowing = state.followedIds.has(shop.id);

      document.getElementById('detailModalHeader').innerHTML = `
        <div>
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px;">
            <span class="cat-badge">${shop.emoji} ${escapeHtml(shop.category)}</span>
            <span class="dist-badge">${shop.distanceMeters} m away</span>
            <span class="status-pill ${shop.liveTone}" style="padding:3px 9px; font-size:11px;">
              <span class="status-dot"></span>${escapeHtml(shop.liveStatus)}
            </span>
          </div>
          <div class="shop-title-row">
            <h2 style="margin:0; font-size:20px; font-weight:800;">${escapeHtml(shop.name)}</h2>
            ${VERIFIED_SVG}
          </div>
          <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted);">📍 ${escapeHtml(shop.address)}</p>
        </div>
        <button class="modal-close" onclick="closeDetailModal()" aria-label="Close details">✕</button>
      `;

      let businessSpecificHtml = '';

      /* --- 1) HOSTELS & PGs --- */

        const d = shop.details;
        businessSpecificHtml = `
          <div class="detail-section">

            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
              ${d.rooms.map((r) => `
                <div class="illustrated-card">
                  ${makeRoomSvg(r.type, r.cooling === 'AC' ? '#4f46e5' : '#0284c7', r.bg)}
                  <div style="padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                      <strong style="font-size:14px;">${escapeHtml(r.type)}</strong>
                      <span class="tag-chip">${escapeHtml(r.cooling)}</span>
                    </div>
                    <div style="font-size:17px; font-weight:800; color:var(--indigo); margin:6px 0 4px;">
                      ₹${r.rent.toLocaleString('en-IN')}<span style="font-size:11px; color:var(--text-subtle); font-weight:600;">/mo</span>
                    </div>
                    <p style="margin:0 0 10px; font-size:12px; color:var(--text-muted);">${escapeHtml(r.note)}</p>
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                      <span class="status-pill ${r.vacant > 0 ? 'green' : 'amber'}" style="font-size:11px; padding:3px 8px;">
                        ${r.vacant > 0 ? `● ${r.vacant} Vacant` : 'Full'}
                      </span>
                      <button class="btn-secondary" style="padding:5px 9px; font-size:11px;" onclick="triggerWhatsApp('${shop.id}', '${escapeHtml(r.type)}')">
                        💬 Ask
                      </button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="detail-section">
            <h3 class="detail-section-title">📋 Hostel Rules &amp; Facilities</h3>
            <div class="rules-grid" style="margin-bottom:12px;">
              <div class="rule-box"><div class="rule-label">For Whom</div><div class="rule-val">${escapeHtml(d.rules.forWhom)}</div></div>
              <div class="rule-box"><div class="rule-label">Security Deposit</div><div class="rule-val">${escapeHtml(d.rules.deposit)}</div></div>
              <div class="rule-box"><div class="rule-label">Electricity</div><div class="rule-val">${escapeHtml(d.rules.electricity)}</div></div>
              <div class="rule-box"><div class="rule-label">Gate Curfew</div><div class="rule-val">${escapeHtml(d.rules.curfew)}</div></div>

    /* =========================================================================
       12. QUICK COMPARE (HOSTELS & LIBRARIES)
       ========================================================================= */
    function toggleCompare(shopId) {
      const shop = getShopById(shopId);
      if (!shop) return;

      const idx = state.compareIds.indexOf(shopId);
      if (idx >= 0) {
        state.compareIds.splice(idx, 1);
      } else {
        // Ensure same category comparison
        if (state.compareIds.length > 0) {
          const firstShop = getShopById(state.compareIds[0]);
          if (firstShop && firstShop.category !== shop.category) {
            state.compareIds = [shopId];
            showToast(`Started new ${shop.category} comparison`);
          } else if (state.compareIds.length >= 3) {
            showToast('You can compare up to 3 places at once');
            renderApp();
            return;
          } else {
            state.compareIds.push(shopId);
          }
        } else {
          state.compareIds.push(shopId);
        }
      }
      renderApp();
    }

    function clearCompare() {
      state.compareIds = [];
      renderApp();
    }

    function syncCompareBar() {
      const bar = document.getElementById('compareBar');
      const text = document.getElementById('compareBarText');
      if (state.activeTab === 'discover' && state.compareIds.length >= 2) {
        const cat = getShopById(state.compareIds[0])?.category || 'Places';
        const shortCat = cat === 'Hostels & PGs' ? 'Hostels' : 'Libraries';
        text.textContent = `Compare ${state.compareIds.length} ${shortCat}`;
        bar.classList.remove('hidden');
      } else {
        bar.classList.add('hidden');
      }
    }

    function openCompareModal() {
      const list = state.compareIds.map(getShopById).filter(Boolean);
      if (list.length < 2) return;

      const isHostel = list[0].category === 'Hostels & PGs';
      document.getElementById('compareModalTitle').textContent = `Compare ${list.length} ${isHostel ? 'Hostels & PGs' : 'Study Libraries'}`;

      document.getElementById('compareModalBody').innerHTML = `
        <div class="compare-table-wrap">
          <table class="compare-table">
            <thead>
              <tr>
                <th>Feature</th>
                ${list.map((s) => `<th>${s.emoji} ${escapeHtml(s.name)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Distance</td>
                ${list.map((s) => `<td><strong>${s.distanceMeters} m away</strong></td>`).join('')}
              </tr>
              <tr>
                <td>Starting ${isHostel ? 'Rent' : 'Fee'}</td>
                ${list.map((s) => `<td style="color:var(--indigo); font-weight:800;">${escapeHtml(s.priceText)}</td>`).join('')}

              </tr>

              </tr>

                ${list.map((s) => `<td>${escapeHtml(s.compareData.curfew)}</td>`).join('')}
              </tr>
              <tr>
                <td>Key Facilities</td>
                ${list.map((s) => `<td>${escapeHtml(s.compareData.highlights)}</td>`).join('')}

    /* =========================================================================
       13. REPORT ISSUE MODAL
       ========================================================================= */
    function openReportModal(shopId) {
      const shop = getShopById(shopId);
      if (!shop) return;
      state.reportShopId = shopId;
      state.selectedReportReason = REPORT_REASONS[0];
      document.getElementById('reportShopName').textContent = shop.name;
      document.getElementById('reportNoteInput').value = '';
      renderReportReasons();
      document.getElementById('reportModal').classList.add('open');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('open');
    }

    function renderReportReasons() {
      document.getElementById('reportReasonsList').innerHTML = REPORT_REASONS.map((reason) => {
        const active = state.selectedReportReason === reason;
        return `
          <button
            type="button"
            onclick="state.selectedReportReason='${escapeHtml(reason)}'; renderReportReasons();"
            style="text-align:left; padding:11px 14px; border-radius:12px; font-size:13px; font-weight:700; border:1.5px solid ${active ? 'var(--indigo)' : 'var(--border)'}; background:${active ? 'var(--indigo-soft)' : '#fff'}; color:${active ? 'var(--indigo-dark)' : 'var(--text)'};"
          >
            ${active ? '✓ ' : ''}${escapeHtml(reason)}
          </button>
        `;
      }).join('');
    }

    function submitReport() {
      closeReportModal();
      showToast('Report sent to NearBuzz Admin for review', 'success');
    }

    /* =========================================================================
       14. USER INTERACTION HANDLERS
       ========================================================================= */
    function applyQuickTag(tag) {
      state.searchQuery = tag;
      state.selectedCategory = 'All';
      renderApp();
    }

    function clearSearch() {
      state.searchQuery = '';
      renderApp();
    }

    function resetAllFilters() {
      state.searchQuery = '';
      state.selectedCategory = 'All';
      state.onlyOpenNow = false;
      state.onlyAvailableToday = false;
      state.maxDistance = 2000;
      renderApp();
    }

    function triggerGps() {
      state.gpsLocating = true;
      renderApp();
      setTimeout(() => {
        state.gpsLocating = false;
        state.gpsLocked = true;
        state.campus = 'Bholaram Ustad Marg, Indore';
        renderApp();
        showToast('GPS locked near Bholaram Ustad Marg, Indore', 'success');
      }, 650);
    }

    function toggleSave(shopId) {
      const shop = getShopById(shopId);
      if (!shop) return;
      if (state.savedIds.has(shopId)) {
        state.savedIds.delete(shopId);
        showToast(`Removed ${shop.name} from Saved`);
      } else {
        state.savedIds.add(shopId);
        showToast(`Saved ${shop.name} for quick access`, 'success');
      }
      syncNavUI();
      renderApp();
      if (state.activeDetailShopId === shopId) renderDetailModal();
    }

    function toggleFollow(shopId) {
      const shop = getShopById(shopId);
      if (!shop) return;
      if (state.followedIds.has(shopId)) {
        state.followedIds.delete(shopId);
        showToast(`Turned off updates from ${shop.name}`);
      } else {
        state.followedIds.add(shopId);
        state.savedIds.add(shopId);
        showToast(`Following ${shop.name} — you'll get live updates!`, 'success');
      }
      syncNavUI();
      renderApp();
      if (state.activeDetailShopId === shopId) renderDetailModal();
    }

    function triggerCall(shopId) {
      const shop = getShopById(shopId);
      if (!shop) return;
      showToast(`Dialing ${shop.name} (${shop.phone})...`, 'indigo');
    }

    function triggerWhatsApp(shopId, specificItem = '') {
      const shop = getShopById(shopId);
      if (!shop) return;
      const msg = specificItem
        ? `Hi, I saw ${shop.name} on NearBuzz. Is the ${specificItem} still available?`
        : `Hi, I saw ${shop.name} on NearBuzz. Could you share today's availability?`;
      showToast(`Opening WhatsApp with: "${msg}"`, 'indigo');
    }

    /* =========================================================================
       15. KEYBOARD ESC HANDLER & INITIAL BOOT
       ========================================================================= */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeReportModal();
        closeCompareModal();
        closeDetailModal();
      }
    });

    syncNavUI();
    renderApp();
  </script>
</body>
</html>
