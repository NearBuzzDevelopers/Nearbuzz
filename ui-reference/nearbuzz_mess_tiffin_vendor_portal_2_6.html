    /* =========================================================================
       3. UTILITIES (ESCAPE, TIME FORMAT, TOASTS)
       ========================================================================= */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getCurrentTimeLabel() {
      const now = new Date();
      return now.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const palette =
        type === 'error'
          ? 'bg-red-700 text-white border-red-800'
          : type === 'info'
          ? 'bg-slate-900 text-white border-slate-700'
          : 'bg-[#047857] text-white border-emerald-900';

      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-sm font-semibold flex items-center gap-2.5 fade-in ${palette}`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✅'}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    /* =========================================================================
       4. WEB SPEECH API — VOICE TO TEXT (WITH GRACEFUL FALLBACK)
       ========================================================================= */
    function startVoiceInput(targetField) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Voice typing is not supported in this browser. Please type normally.', 'info');
        return;
      }

      try {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        state.listeningField = targetField;
        renderTabContent();
        showToast('Listening... Speak clearly now', 'info');

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript;
          if (targetField === 'lunchMenu') {
            state.todayMenu.lunch.items = state.todayMenu.lunch.items
              ? `${state.todayMenu.lunch.items}, ${spoken}`
              : spoken;
          } else if (targetField === 'dinnerMenu') {
            state.todayMenu.dinner.items = state.todayMenu.dinner.items
              ? `${state.todayMenu.dinner.items}, ${spoken}`
              : spoken;
          } else if (targetField === 'planName') {
            state.newPlan.name = state.newPlan.name ? `${state.newPlan.name} ${spoken}` : spoken;
          } else if (targetField === 'noticeText') {
            state.noticeDraft = state.noticeDraft ? `${state.noticeDraft} ${spoken}` : spoken;
          }
          state.listeningField = null;
          renderTabContent();
          showToast('Voice text added!');
        };

        recognition.onerror = () => {
          state.listeningField = null;
          renderTabContent();
          showToast('Could not hear clearly. Tap mic again or type normally.', 'error');
        };

        recognition.onend = () => {
          if (state.listeningField === targetField) {
            state.listeningField = null;
            renderTabContent();
          }
        };

        recognition.start();
      } catch (e) {
        state.listeningField = null;
        renderTabContent();
        showToast('Microphone unavailable. Please type instead.', 'info');
      }
    }

    function renderTabsBar() {

        { id: 'info', icon: '📍', label: 'Shop Info, Photos & GPS' }
      ];

      document.getElementById('tabsBar').innerHTML = tabs
        .map((t) => {
          const active = state.activeTab === t.id;
          return `
            <button
              onclick="switchTab('${t.id}')"
              class="min-h-[52px] px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap ${
                active

              }"
            >
              <span class="text-base">${t.icon}</span>
              <span>${t.label}</span>
            </button>
          `;
        })
        .join('');
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderTabsBar();
      renderTabContent();
    }

    function renderTabContent() {
      const container = document.getElementById('tabContent');
      if (state.activeTab === 'menu') {
        container.innerHTML = renderTodayMenuTab();
      } else if (state.activeTab === 'plans') {
        container.innerHTML = renderMealPlansTab();
      } else if (state.activeTab === 'facilities') {
        container.innerHTML = renderFacilitiesTab();
      } else if (state.activeTab === 'timings') {
        container.innerHTML = renderTimingsAndNoticesTab();
      } else if (state.activeTab === 'info') {
        container.innerHTML = renderShopInfoTab();
        attachMapInteractions();
      }

    /* =========================================================================

      state.todayMenu[mealKey].specialDish = dish;
      renderTabContent();
    }

    function handleDailyFoodPhoto(mealKey, event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.todayMenu[mealKey].photoUrl = e.target.result;
        state.todayMenu[mealKey].photoTime = `Uploaded Today, ${getCurrentTimeLabel()}`;
        renderTabContent();
        showToast(`${mealKey === 'lunch' ? 'Lunch' : 'Dinner'} photo uploaded!`);
      };
      reader.readAsDataURL(file);
    }

      state.todayMenu[mealKey].photoUrl = '';
      state.todayMenu[mealKey].photoTime = '';
      renderTabContent();
      showToast('Food photo removed', 'info');
    }

    function publishMealMenu(mealKey) {
      const label = mealKey === 'lunch' ? "Today's Lunch" : "Today's Dinner";

      renderTabContent();
      showToast(`${label} menu saved & published to students!`);

                      />

                          type="number"
                          min="0"
                          value="${escapeHtml(np.price)}"
                          placeholder="e.g. 3200"
                          oninput="state.newPlan.price = this.value"
                          class="w-full min-h-[52px] px-4 py-3 rounded-r-xl bg-white border-2 border-slate-200 text-lg font-extrabold text-[#0F172A] focus:outline-none focus:border-[#059669]"
                        />
                      </div>
                    </div>

                    <div class="space-y-2">

                          return `
                            <button
                              type="button"

                                  ? 'bg-[#059669] border-[#059669] text-white'
                                  : 'bg-white border-slate-200 text-slate-700 hover:border-emerald-400'

                              ${active ? '✓ ' : ''}${c}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>

                  <!-- What's Included -->
                  <div class="space-y-2">
                    <label class="block text-sm sm:text-base font-bold text-[#0F172A]">4. What's Included in This Plan?</label>
                    <input

                      placeholder="e.g. 5 Roti, Dal, 2 Sabzi, Rice, Salad"

                      class="w-full min-h-[52px] px-4 py-3 rounded-xl bg-white border-2 border-slate-200 text-sm sm:text-base font-medium text-[#0F172A] focus:outline-none focus:border-[#059669]"
                    />

                  <!-- Popular Plan Toggle + Add Button -->
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                    <button
                      type="button"
                      onclick="state.newPlan.popular = !state.newPlan.popular; renderTabContent();"
                      class="min-h-[48px] px-4 py-2.5 rounded-xl border-2 font-bold text-sm transition cursor-pointer flex items-center gap-2 ${
                        np.popular

                          : 'bg-white border-slate-200 text-slate-600 hover:border-amber-300'
                      }"
                    >
                      <span>${np.popular ? '⭐' : '☆'}</span>
                      <span>Mark as "Popular Plan" Badge</span>
                    </button>

                    <button
                      type="button"
                      onclick="addNewMealPlan()"
                      class="min-h-[52px] px-8 py-3 rounded-2xl bg-[#059669] hover:bg-[#047857] text-white font-extrabold text-base shadow-sm cursor-pointer"
                    >
                      + Add Meal Plan
                    </button>
                  </div>
                </div>
              `
              : ''
          }
        </div>

        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2 px-1">
            <h2 class="text-lg sm:text-xl font-extrabold text-[#0F172A]">Your Meal Plans &amp; Rates (${state.plans.length})</h2>
            <span class="text-xs sm:text-sm text-slate-500">Tap Active/Paused anytime to hide or show a plan</span>
          </div>

          ${state.plans
            .map(
              (p) => `
                <div class="bg-white rounded-2xl border-2 ${
                  p.active ? 'border-emerald-100' : 'border-slate-200 bg-slate-50/70'

                      }

                  <div class="flex flex-wrap items-center gap-2 shrink-0">

                      type="button"

                        p.active
                          ? 'bg-[#059669] hover:bg-[#047857] border-[#059669] text-white'
                          : 'bg-amber-100 hover:bg-amber-200 border-amber-400 text-amber-900'
                      }"

                      type="button"

                      aria-label="Delete plan"
                      class="min-h-[48px] px-3.5 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 font-bold text-sm cursor-pointer"
                    >
                      🗑️
                    </button>
                  </div>
                </div>
              `
            )
            .join('')}
        </div>
      `;

      return addPlanCard + plansListHtml;
    }

    function addNewMealPlan() {
      const np = state.newPlan;
      const priceNum = parseFloat(np.price);
      if (!np.name.trim()) {
        showToast('Please enter a Plan Name', 'error');
        return;
      }
      if (isNaN(priceNum) || priceNum <= 0) {
        showToast('Please enter a valid Price in ₹', 'error');
        return;
      }

      state.plans.unshift({
        id: 'plan_' + Date.now(),
        name: np.name.trim(),
        price: priceNum,
        cycle: np.cycle,
        included: np.included.trim() || 'Fresh home-style meal',
        popular: np.popular,
        active: true
      });

      state.newPlan = { name: '', price: '', cycle: 'Per Month', included: '', popular: false };
      renderHeaderSummary();
      renderTabContent();
      showToast('New meal plan added!');
    }

    function togglePlanActive(id) {
      const plan = state.plans.find((p) => p.id === id);
      if (!plan) return;
      plan.active = !plan.active;
      renderHeaderSummary();
      renderTabContent();
      showToast(plan.active ? 'Plan is now Active' : 'Plan Paused', 'info');
    }

    function copyMealPlan(id) {
      const plan = state.plans.find((p) => p.id === id);
      if (!plan) return;
      state.plans.unshift({
        ...plan,
        id: 'plan_' + Date.now(),
        name: plan.name + ' (Copy)',
        popular: false
      });
      renderHeaderSummary();
      renderTabContent();
      showToast('Meal plan copied!');
    }

    function deleteMealPlan(id) {
      state.plans = state.plans.filter((p) => p.id !== id);
      renderHeaderSummary();
      renderTabContent();
      showToast('Meal plan deleted', 'info');
    }

    function attachMapInteractions() {
      const canvas = document.getElementById('messMapCanvas');
      const pinEl = document.getElementById('messMapPin');
      if (!canvas || !pinEl) return;

      let dragging = false;

      const movePin = (clientX, clientY) => {
        const rect = canvas.getBoundingClientRect();
        const xPct = Math.max(8, Math.min(92, ((clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(14, Math.min(92, ((clientY - rect.top) / rect.height) * 100));

        const lat = 22.6975 - (yPct / 100) * 0.012;
        const lng = 75.8590 + (xPct / 100) * 0.018;

        let nearest = CAMPUS_LANDMARKS[0];
        let minDist = Infinity;
        CAMPUS_LANDMARKS.forEach((lm) => {
          const d = Math.hypot(lm.x - xPct, lm.y - yPct);
          if (d < minDist) { minDist = d; nearest = lm; }
        });

        state.shop.mapPin = {
          x: Math.round(xPct),
          y: Math.round(yPct),
          lat,
          lng,
          landmark: `Near ${nearest.name}`
        };

        pinEl.style.left = state.shop.mapPin.x + '%';
        pinEl.style.top = state.shop.mapPin.y + '%';

        const coordsEl = document.getElementById('mapCoordsLabel');
        if (coordsEl) coordsEl.textContent = `${lat.toFixed(4)}° N, ${lng.toFixed(4)}° E`;
        const lmEl = document.getElementById('mapLandmarkLabel');
        if (lmEl) lmEl.textContent = `📍 ${state.shop.mapPin.landmark}`;
      };

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        canvas.setPointerCapture(e.pointerId);
        movePin(e.clientX, e.clientY);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (dragging) movePin(e.clientX, e.clientY);
      });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });
    }

        y: lm.y,
        lat: lm.lat,
        lng: lm.lng,
        landmark: `Near ${lm.name}`
      };
      renderTabContent();
      showToast(`Pin moved to ${lm.name}`, 'info');
    }

    /* =========================================================================
       11. LIVE STUDENT PREVIEW MODAL (INDIGO & BLUE #4F46E5)
       ========================================================================= */
    function openStudentPreview() {
      const s = state.shop;
      const cfg = state.settings;
      const lunch = state.todayMenu.lunch;
      const dinner = state.todayMenu.dinner;
      const activePlans = state.plans.filter((p) => p.active);

      document.getElementById('studentPreviewBody').innerHTML = `
        <!-- Mess Header Card -->
        <div class="bg-white rounded-2xl border border-indigo-100 shadow-sm p-5 space-y-4">
          <div class="flex items-start gap-3.5">
            <div class="w-14 h-14 rounded-2xl bg-indigo-50 border border-indigo-200 flex items-center justify-center text-3xl shrink-0">
              🍛
            </div>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-[#4F46E5] text-xs font-extrabold">Mess &amp; Tiffin</span>
                <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-extrabold">✓ Verified</span>
                <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">🌿 ${escapeHtml(cfg.foodType)}</span>
              </div>
              <h3 class="text-xl font-extrabold text-slate-900 mt-1">${escapeHtml(s.name)}</h3>
              <p class="text-sm text-slate-600">📍 ${escapeHtml(s.address)}</p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
            <span class="px-3 py-1 rounded-xl text-xs font-extrabold ${
              s.isOpenToday ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
            }">
              ${s.isOpenToday ? '🟢 Open Today' : '🟠 Closed Today'}
            </span>
            <span class="px-3 py-1 rounded-xl bg-blue-50 text-blue-800 text-xs font-bold">
              📦 ${escapeHtml(s.bookingStatus)}
            </span>
            <span class="px-3 py-1 rounded-xl bg-indigo-50 text-indigo-800 text-xs font-bold">
              🍽️ ${escapeHtml(cfg.serviceMode)}
            </span>
          </div>

          <!-- Call / WhatsApp / Directions -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="min-h-[46px] rounded-xl bg-[#4F46E5] text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5">
              📞 Call
            </div>
            <div class="min-h-[46px] rounded-xl bg-emerald-600 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5">
              💬 WhatsApp
            </div>
            <div class="min-h-[46px] rounded-xl bg-blue-50 text-blue-800 border border-blue-200 font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5">
              🗺️ Directions
            </div>
          </div>

          <!-- Facilities -->
          <div class="flex flex-wrap gap-1.5">
            ${cfg.facilities
              .map((f) => `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-xs font-semibold">✓ ${escapeHtml(f)}</span>`)
              .join('')}
          </div>
        </div>

        <!-- Posted Notice -->
        ${
          state.notices.length
            ? `
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-1">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-amber-800">📢 Latest Notice</span>
                <p class="text-sm font-bold text-slate-900">${escapeHtml(state.notices[0].text)}</p>
              </div>
            `
            : ''
        }

        <!-- Today's Lunch & Dinner Menus with Food Photos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${[
            { title: "☀️ Today's Lunch", data: lunch },
            { title: "🌙 Today's Dinner", data: dinner }
          ]
            .map(
              (m) => `
                <div class="bg-white rounded-2xl border border-indigo-100 overflow-hidden shadow-xs flex flex-col">
                  ${
                    m.data.photoUrl
                      ? `
                        <div class="relative">
                          <img src="${m.data.photoUrl}" alt="${m.title}" class="w-full h-36 object-cover" />
                          <span class="absolute bottom-2 left-2 px-2.5 py-0.5 rounded-full bg-slate-900/75 text-white text-[10px] font-bold">
                            🕒 ${escapeHtml(m.data.photoTime)}
                          </span>
                        </div>
                      `
                      : ''
                  }
                  <div class="p-4 space-y-2 flex-1">
                    <h4 class="font-extrabold text-slate-900 text-sm">${m.title}</h4>
                    ${
                      m.data.specialDish
                        ? `<span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 text-xs font-extrabold">⭐ Special: ${escapeHtml(m.data.specialDish)}</span>`
                        : ''
                    }
                    <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${escapeHtml(m.data.items)}</p>
                  </div>
                </div>
              `
            )
            .join('')}
        </div>

        <!-- Meal Plans -->
        <div class="bg-white rounded-2xl border border-indigo-100 p-4 space-y-3">
          <h4 class="font-extrabold text-slate-900 text-base">🍽️ Meal Plans &amp; Tiffin Rates</h4>
          <div class="divide-y divide-slate-100">
            ${activePlans
              .map(
                (p) => `
                  <div class="py-3 first:pt-0 last:pb-0 flex items-start justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold text-slate-900 text-sm">${escapeHtml(p.name)}</span>
                        ${p.popular ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[10px] font-extrabold">⭐ Popular</span>` : ''}
                      </div>
                      <p class="text-xs text-slate-600 mt-0.5">${escapeHtml(p.included)}</p>
                    </div>
                    <div class="text-right shrink-0">
                      <span class="text-base font-extrabold text-[#4F46E5]">₹${Number(p.price).toLocaleString('en-IN')}</span>
                      <span class="block text-[11px] text-slate-500">${escapeHtml(p.cycle)}</span>
                    </div>
                  </div>
                `
              )
              .join('')}
          </div>
        </div>
      `;

      const modal = document.getElementById('studentPreviewModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeStudentPreview() {
      const modal = document.getElementById('studentPreviewModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    /* =========================================================================
       12. INITIALIZE
       ========================================================================= */
    renderAll();
  </script>
</body>
</html>
